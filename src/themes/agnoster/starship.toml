format = """
$status\
$username\
$hostname\
$python\
$directory\
$git_branch\
$git_status\
$character\
"""

palette = "agnoster"

[palettes.agnoster]
black = "#000000"
blue = "#0000ee"
cyan = "#00cdcd"
green = "#00cd00"
yellow = "#cdcd00"
red = "#cd0000"
white = "#e5e5e5"

[status]
disabled = false
symbol = "✘"
success_symbol = ""
style = "fg:red bg:black"
format = "([ $symbol$status ]($style)[](fg:black bg:black))"

[username]
style_user = "fg:white bg:black"
style_root = "fg:yellow bg:black"
format = "[ $user]($style)"
show_always = false

[hostname]
ssh_only = true
style = "fg:white bg:black"
format = "[@$hostname ]($style)[](fg:black bg:cyan)"

[python]
symbol = ""
style = "fg:black bg:cyan"
format = "([ $virtualenv ]($style)[](fg:cyan bg:blue))"

[directory]
style = "fg:black bg:blue"
format = "[ $path ]($style)[](fg:blue bg:green)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
style = "fg:black bg:green"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:black bg:yellow"
format = "([±$all_status$ahead_behind ]($style)[](fg:yellow))"
conflicted = "~${count}"
ahead = "+${count}"
behind = "-${count}"
diverged = "~+${ahead_count}-${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "=${count}"
renamed = ">${count}"
deleted = "x${count}"

[character]
success_symbol = "[](fg:green) "
error_symbol = "[](fg:red) "
vimcmd_symbol = "[](fg:blue) "

[cmd_duration]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[golang]
disabled = true

[rust]
disabled = true
