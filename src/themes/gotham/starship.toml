format = """
$status\
$username\
$hostname\
$python\
$directory\
$git_branch\
$git_status\
$custom\
"""

palette = "gotham"

[palettes.gotham]
black = "#0a0f14"
blue = "#195465"
cyan = "#33859d"
green = "#26a98b"
yellow = "#edb54b"
red = "#c33027"
white = "#98d1ce"

[status]
disabled = false
symbol = "✘"
success_symbol = ""
style = "fg:red bg:black"
format = "([ $symbol$status ]($style)[](fg:black bg:black))"

[username]
style_user = "fg:white bg:black"
style_root = "fg:yellow bg:black"
format = "[ $user]($style)"
show_always = false

[hostname]
ssh_only = true
style = "fg:white bg:black"
format = "[@$hostname ]($style)[](fg:black bg:cyan)"

[python]
symbol = ""
style = "fg:black bg:cyan"
format = "([ $virtualenv ]($style)[](fg:cyan bg:blue))"

[directory]
style = "fg:black bg:blue"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
style = "fg:black bg:green"
format = "[](fg:blue bg:green)[ $symbol $branch ]($style)"

[git_status]
style = "fg:black bg:yellow"
format = "([](fg:green bg:yellow)[ ±$all_status$ahead_behind ]($style)[](fg:yellow) )"
conflicted = "~${count}"
ahead = "+${count}"
behind = "-${count}"
diverged = "~+${ahead_count}-${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "=${count}"
renamed = ">${count}"
deleted = "x${count}"

[custom.git_clean_tail]
when = """git rev-parse --is-inside-work-tree >/dev/null 2>&1 &&
  test -z "$(git status --porcelain 2>/dev/null)" &&
  test -z "$(git stash list 2>/dev/null)" &&
  counts="$(git rev-list --left-right --count '@{upstream}...HEAD' 2>/dev/null | tr '\t' ' ')" &&
  { test -z "$counts" || test "$counts" = "0 0"; }"""
format = "[](fg:green) "

[custom.directory_tail]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[](fg:blue) "

[cmd_duration]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[golang]
disabled = true

[rust]
disabled = true
